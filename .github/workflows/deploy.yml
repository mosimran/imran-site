# Checks first, deploy only on green. BUILD.md section 7 asks for exactly this,
# which is why the native Cloudflare Pages git integration stays switched off:
# it would deploy on push regardless of whether the checks passed.
name: build and deploy

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # check-errata.mjs (T21) diffs against origin/main, so it needs history.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run check

      # BUILD.md section 6, in full. Each of these has been proven to fail on a
      # deliberate breakage, which is the only reason to trust one that passes.
      - name: budgets
        run: node scripts/check-budget.mjs

      - name: internal links and published anchors
        run: node scripts/check-links.mjs

      # Reports, never fails. Shipping the prototype content as-is is a decision
      # on record; this is the register of that debt.
      - name: placeholder ledger
        run: node scripts/placeholders.mjs

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    name: deploy
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      # The secret wins if it is set. The literal is the fallback, because an
      # account ID is an identifier rather than a credential: it appears in
      # dashboard URLs and is already written down in docs/TASKS.md T03 and
      # PLAN.md 13.3. So the deploy keeps working if the secret is ever removed,
      # and only one thing, the token, is genuinely required.
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'f697cce1cf00f8132c900d2c643ad935' }}
      WRANGLER_VERSION: 4.71.0

    steps:
      # A deploy job that reports success without deploying is worse than one
      # that fails, because the badge says shipped. On main, absent credentials
      # are a failure and not a skip. Proven by the run on the commit that
      # introduced this: deploy went red with no token set, where the previous
      # three runs had gone green while uploading nothing.
      - name: deploy credentials must be present on main
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set, so this push was NOT deployed."
            echo "The site is still serving whatever was last published by hand."
            echo "Create a token with Account > Cloudflare Pages > Edit and add it as a"
            echo "repository secret. wrangler cannot mint one: its OAuth session is"
            echo "refused by /user/tokens with code 9109. See docs/PLAN.md section 13.3."
            exit 1
          fi

      # Checkout first: download-artifact writes into the workspace and a
      # checkout afterwards would clear it. Needed for scripts/check-live.mjs.
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist

      # wrangler directly rather than through an action wrapper. One fewer
      # third party in the release path, a pinned version rather than a
      # floating tag, and the same command that is run by hand when this job
      # cannot run at all.
      - name: deploy to cloudflare pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@"$WRANGLER_VERSION" pages deploy dist \
            --project-name imran-site \
            --branch main

      # Deployed and unverified is the same class of problem as green and
      # undeployed. Checks the live primary, not the artifact, and asks for it
      # as a browser would: the CDN features that inject script only do so on
      # browser-shaped requests, so the curl this step used to run passed while
      # every real visitor was served a third-party module.
      - name: verify the live site against the budgets
        run: node scripts/check-live.mjs https://mosthofaimran.com
