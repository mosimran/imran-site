pages_build_output_dir = "dist"

[[d1_databases]]
binding = "CV_DB"
database_name = "imran-cv"
database_id = "a3c657c9-3f6c-4199-bf6d-b21bb951426d"

# The resume PDF. KV, not R2: the requirement is no public URL and a streamed
# response, which KV meets for a 430 KB object, and wrangler's OAuth cannot
# grant an r2 scope at all. R2 would matter for a large file or range requests.
[[kv_namespaces]]
binding = "CV_FILE"
id = "ede7fb50281240258c06cca10ea66dcd"
